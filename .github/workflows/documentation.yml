name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    name: Documentation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install hashed documentation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/requirements.txt
      - name: Check documentation
        run: python tools/check_docs.py
      - name: Prove regressions fail
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
