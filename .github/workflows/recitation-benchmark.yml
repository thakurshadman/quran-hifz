name: Recitation benchmark

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Install audio decoding tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Offline scoring and harness regressions
        run: python -m unittest discover -s benchmarks/recitation/tests -p 'test_*.py' -v
      - name: Check command interface and worker syntax
        run: |
          python benchmarks/recitation/benchmark.py --help
          python -m py_compile benchmarks/recitation/benchmark.py benchmarks/recitation/scoring.py benchmarks/recitation/whisper_runner.py
          node --check benchmarks/recitation/node_runner.mjs
